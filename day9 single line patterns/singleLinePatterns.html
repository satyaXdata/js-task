<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1;i<=9;i++){
            for(let j=1;j<=9;j++){
                if(i==5 || j==5 || (i==1 && j>=5) || (j==1 && i<=5) || (j==9 && i>=5) || (i==9 && j<=5)){
                    document.write("* ");
                }
                else{
                    document.write("&nbsp;&nbsp;&nbsp;")
                }
            }
            document.write("<br/>")
        }
        // output:
        // *       * * * * *
        // *       *
        // *       *
        // *       *
        // * * * * * * * * *
        //         *       *
        //         *       *
        //         *       *
        // * * * * *       *
        document.write("<hr/>")
        // chakra
        for(let i=1;i<=9;i++){
            for(let j=1;j<=13;j++){
                if(i==3 || i==7 || i+j==8 || i+j==16 || j-i==6 || i-j==2){
                    document.write("* ")
                }
                else{
                    document.write("&nbsp;&nbsp;&nbsp;")
                }
            }
            document.write("<br/>")
        }   
        document.write("<hr/>")
        //NUMBER 2
        for (let i=1;i<=7;i++){
            for(let j=1;j<=7;j++){
                if(i==1 || i==4 || i==7|| (i<=4 && j==7) || (i>=4 && j==1)){
                    document.write("* ")
                }
                else{
                    document.write("&nbsp;&nbsp;&nbsp")
                }
            }
            document.write("<br/>")
        }
    </script>
</body>
</html>
